<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Rollen zuweisen</title>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
</head>
<header th:replace="~{fragments/header :: header}"></header>

<!--
    hx-headers on <body> automatically adds the CSRF token to EVERY HTMX request
    that originates from anywhere inside this page – no need to add it per element.
-->
<body th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;:&quot;${_csrf.token}&quot;}|">
<div id="notification" class="notification"></div>
<input type="checkbox" id="sidebarToggle" class="sidebar-toggle-checkbox">
<th:block th:replace="~{fragments/sidebar :: sidebar(active='practitioner-roles', subtitle='Verwaltung')}"></th:block>

<div class="wrapper">
            <div class="title">
                <h1>Rollen der Gesundheitsdiensteanbieter</h1>
                <p>Weisen Sie den Gesundheitsdiensteanbietern Rollen zu.</p>
            </div>

            <div class="boxed">
                <div class="card-row">
                    <h2 class="boxed-title">Rollen</h2>
                    <div class="search-box">
                        <span class="search-mag" aria-hidden="true"></span>
                        <input type="text" name="q" placeholder="Name suchen..." autocomplete="off"
                                th:value="${q}"
                                hx-get="/admin/practitioner-roles/search"
                                hx-trigger="input changed delay:300ms"
                                hx-target="#practitionerRolesTable"
                                hx-swap="outerHTML"/>
                    </div>
                </div>
        <th:block th:replace="~{fragments/practitioner-roles :: practitioner-table}"></th:block>
    </div>
</div>

<!--
    The assignment dialog is loaded into #practitionerRolesDialog by each row's
    "Rollen zuweisen" label (hx-get). The dialog fragment is self-contained: it renders its
    own hidden checkbox + overlay and shows itself; the ✕ / "Abbrechen" / backdrop labels
    inside the fragment close it. No page-level toggle and no script.
-->
<div id="practitionerRolesDialog"></div>
</body>
</html>
