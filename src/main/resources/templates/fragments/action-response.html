<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="success">
        <div id="notification" class="notification notification-success" hx-swap-oob="true">
            <strong>Erfolg!</strong> <span th:text="${message}"></span>
        </div>
        <th:block th:replace="~{index :: boxedForm}"></th:block>
    </th:block>

    <th:block th:fragment="error">
        <div id="notification" class="notification notification-error" hx-swap-oob="true">
            <strong>Fehler!</strong> <span th:text="${error}"></span>
        </div>
    </th:block>

    <th:block th:fragment="reset">
        <div id="notification" class="notification notification-info" hx-swap-oob="true">
            <span th:text="${message}"></span>
        </div>
        <th:block th:replace="~{index :: boxedForm}"></th:block>
    </th:block>
</body>
</html>
