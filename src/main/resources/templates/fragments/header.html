<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Shared page header. The breadcrumb trail comes from the model (`breadcrumbs`, derived by
    BreadcrumbModelAdvice from the request path) so no page hard-codes it. Next to the profile
    summary sits the logout button showing only the logout symbol (red).
-->

<header th:fragment="header">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
        <span th:each="crumb, iter : ${breadcrumbs}"
                th:text="${iter.last} ? ${crumb} : ${crumb + ' > '}"></span>
    </nav>

    <label class="side-hide" for="sidebarToggle">☰</label>

    <div class="profile-group">
        <div class="profile-summary">
            <div class="avatar" th:text="${currentUser.initials}">MH</div>
            <div class="profile-title-group">
                <h3 class="profile-title" th:text="${currentUser.name}">Max Huber</h3>
                <p class="role">Verzeichnisverwaltung</p>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout-btn" aria-label="Abmelden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </form>
    </div>
</header>

</body>
</html>
