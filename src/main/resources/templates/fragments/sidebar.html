<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Shared sidebar, split into two sections divided by a text header only:
    - "Persönlich"  (visible to every IDP user):  Rollen, Einladungen
    - "Admin"  (only users holding the admin realm role, i.e. ROLE_ADMIN
      mapped from `realm_access.roles`):          Sichtbarkeit, Einladungsrechte
  `active` selects the highlighted entry; `subtitle` is the text under the
  "Provider Directory" brand and defaults to "Verwaltung".
-->

<div th:fragment="sidebar(active, subtitle)" class="sidebar" id="sidebar">
    <div class="side-head">
        <div class="icon">PD</div>
        <div class="side-head-title">
            <h3>Provider Directory</h3>
            <div th:text="${subtitle} ?: 'Verwaltung'">Verwaltung</div>
        </div>
    </div>

    <div class="side-section">Persönlich</div>
    <a draggable="false" th:classappend="${active == 'roles'} ? 'sidebar-active'" href="/">Rollen</a>
    <a draggable="false" th:classappend="${active == 'invitations'} ? 'sidebar-active'" href="/me/invitation-rules">Einladungen</a>

    <div class="side-section" th:if="${currentUser.admin}">Admin</div>
    <a draggable="false" th:if="${currentUser.admin}" th:classappend="${active == 'visibility'} ? 'sidebar-active'" href="/admin/visibility">Sichtbarkeit</a>
    <a draggable="false" th:if="${currentUser.admin}" th:classappend="${active == 'organizations'} ? 'sidebar-active'" href="/admin/organizations">Organisationen</a>
    <a draggable="false" th:if="${currentUser.admin}" th:classappend="${active == 'invitation-rights'} ? 'sidebar-active'" href="/admin/invitation-rights">Einladungsrechte</a>
    <a draggable="false" th:if="${currentUser.admin}" th:classappend="${active == 'practitioner-roles'} ? 'sidebar-active'" href="/admin/practitioner-roles">Rollen zuweisen</a>

    <label class="side-hide side-hide-close" for="sidebarToggle">✕ Menü ausblenden</label>
</div>

</body>
</html>
