<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="practitionerList">
    <th:block th:if="${!#strings.isEmpty(q)}">
        <div th:if="${#lists.isEmpty(items)}" class="no-suggestions">Keine Ergebnisse gefunden</div>
        <div th:each="item : ${items}" class="suggestion-item"
                th:hx-get="@{/api/practitioners/select(id=${item.id},name=${item.name},organizationId=${item.organizationId},organizationName=${item.organizationName})}"
                hx-target="#practitionerBox" hx-swap="outerHTML">
            <div th:text="${item.name}"></div>
            <div style="font-size: 12px; color: #999;" th:text="'Trust Level: ' + ${item.trustLevel}"></div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="organizationList">
    <th:block th:if="${!#strings.isEmpty(q)}">
        <div th:if="${#lists.isEmpty(items)}" class="no-suggestions">Keine Ergebnisse gefunden</div>
        <div th:each="item : ${items}" class="suggestion-item"
                th:hx-get="@{/api/organizations/select(id=${item.id},name=${item.name})}"
                hx-target="#organizationBox" hx-swap="outerHTML">
            <div th:text="${item.name}"></div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="roleList">
    <th:block th:if="${!#strings.isEmpty(q)}">
        <div th:if="${#lists.isEmpty(items)}" class="no-suggestions">Keine Ergebnisse gefunden</div>
        <div th:each="item : ${items}" class="suggestion-item"
                th:hx-get="@{/api/roles/select(id=${item.id})}"
                hx-include="#roleIds" hx-target="#roleBox" hx-swap="outerHTML">
            <div th:text="${item.codeDisplay}"></div>
            <div th:if="${!#strings.isEmpty(item.title)}" style="font-size: 12px; color: #999;"
                    th:text="${item.title}"></div>
        </div>
    </th:block>
</th:block>

</body>
</html>
