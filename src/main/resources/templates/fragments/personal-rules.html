<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    The whole "Blockierte Rollen" list. The page includes it once; add/remove responses
    refresh it (out-of-band on save, as the swap target on remove).
    rules = flat List<PersonalInvitationRuleView>; the blacklist is global, so each rule
    blocks one role everywhere. Every role chip removes itself via the remove form.
-->
<th:block th:fragment="panel">
    <div id="personalRulesPanel">
        <th:block th:replace="~{fragments/personal-rules :: rules-list}"></th:block>
    </div>
</th:block>

<th:block th:fragment="rules-list">
    <div class="blocked-row" th:if="${#lists.isEmpty(rules)}">
        <div class="blocked-label">Blockierte Rollen</div>
        <div class="blocked-items">
            <span class="selected-item blocked-none">
                Keine Regeln – Einladungen von allen Rollen erlaubt.
            </span>
        </div>
    </div>
    <div class="blocked-row" th:unless="${#lists.isEmpty(rules)}">
        <div class="blocked-label">Blockierte Rollen</div>
        <div class="blocked-items">
            <form class="selected-item" th:each="rule : ${rules}"
                    th:action="@{/me/invitation-rules/remove}" method="post"
                    th:attr="hx-post=@{/me/invitation-rules/remove}"
                    hx-target="#personalRulesPanel" hx-swap="outerHTML">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="roleToken" th:value="${rule.roleToken}">
                <span th:text="${rule.roleDisplay}" th:title="${rule.roleToken}">Fachärztin/Facharzt für Herzchirurgie</span>
                <button type="submit" aria-label="Entfernen">✕</button>
            </form>
        </div>
    </div>
</th:block>

<!--
    Save succeeded: the response replaces #personalRulesToggle with an unchecked copy
    (out-of-band), which unchecks the CSS toggle and hides the overlay – the dialog closes.
    The other out-of-band swaps refresh the notification and the page's list.
-->
<th:block th:fragment="save-ok">
    <input type="checkbox" id="personalRulesToggle" class="dialog-toggle-checkbox" hx-swap-oob="outerHTML">
    <div id="notification" class="notification notification-success" hx-swap-oob="true">
        <strong>Erfolg!</strong> <span th:text="${message}">Regel hinzugefügt.</span>
    </div>
    <div id="personalRulesPanel" hx-swap-oob="outerHTML">
        <th:block th:replace="~{fragments/personal-rules :: rules-list}"></th:block>
    </div>
</th:block>

<th:block th:fragment="save-error">
    <div class="dialog-error">Speichern fehlgeschlagen.</div>
</th:block>

</body>
</html>
