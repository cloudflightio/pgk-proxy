<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Rollen</title>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
</head>
<th:block th:replace="~{fragments/header :: header}"></th:block>
<body th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;:&quot;${_csrf.token}&quot;}|">
<div id="notification" class="notification"></div>
<input type="checkbox" id="sidebarToggle" class="sidebar-toggle-checkbox">
<th:block th:replace="~{fragments/sidebar :: sidebar(active='roles', subtitle='Verwaltung')}"></th:block>
<div class="wrapper">
    <div class="title">
        <h1>Rollen</h1>
        <p>Wählen Sie einen Gesundheitsdiensteanbieter, eine Organisation und eine Rolle aus.</p>
    </div>
    <div class="boxed">
        <h2 class="boxed-title">Rollen-Details</h2>

        <form id="roleForm" th:fragment="boxedForm" hx-post="/api/roles/create" hx-swap="none"
                hx-swap-oob="true" hx-params="practitionerId,organizationId,roleIds,removedRoleIds">
            <div class="box-group" id="practitionerBox" th:fragment="practitionerBox">
                <label for="practitionerInput">Gesundheitsdiensteanbieter</label>
                <div class="combobox-container">
                    <input
                            type="text"
                            id="practitionerInput"
                            name="q"
                            class="combobox-input"
                            placeholder="Name eingeben..."
                            autocomplete="off"
                            th:value="${practitionerName}"
                            th:disabled="${practitionerLocked}"
                            hx-get="/api/practitioners/search"
                            hx-trigger="input changed delay:300ms"
                            hx-target="#practitionerSuggestions"
                            hx-swap="innerHTML"
                            hx-params="q"
                    />
                    <div class="suggestions-dropdown" id="practitionerSuggestions"></div>
                </div>
                <input type="hidden" id="practitionerId" name="practitionerId" th:value="${practitionerId}">
            </div>

            <!-- "organizationBoxOob" is set when the box is refreshed as a side effect of another swap -->
            <div class="box-group" id="organizationBox" th:fragment="organizationBox"
                    th:attr="hx-swap-oob=${organizationBoxOob}">
                <label for="organizationInput">Organisation</label>
                <div class="combobox-container">
                    <input
                            type="text"
                            id="organizationInput"
                            name="q"
                            class="combobox-input"
                            placeholder="Organisation eingeben..."
                            autocomplete="off"
                            th:value="${organizationName}"
                            hx-get="/api/organizations/search"
                            hx-trigger="input changed delay:300ms"
                            hx-target="#organizationSuggestions"
                            hx-swap="innerHTML"
                            hx-params="q"
                    />
                    <div class="suggestions-dropdown" id="organizationSuggestions"></div>
                </div>
                <input type="hidden" id="organizationId" name="organizationId" th:value="${organizationId}">
            </div>

            <div class="box-group" id="roleBox" th:fragment="roleBox">
                <label for="roleInput">Rollen</label>
                <div class="combobox-container">
                    <input
                            type="text"
                            id="roleInput"
                            name="q"
                            class="combobox-input"
                            placeholder="Rolle eingeben..."
                            autocomplete="off"
                            hx-get="/api/roles/search"
                            hx-trigger="input changed delay:300ms"
                            hx-target="#roleSuggestions"
                            hx-swap="innerHTML"
                            hx-params="q"
                    />
                    <div class="suggestions-dropdown" id="roleSuggestions"></div>
                </div>
                <div class="selected-items" id="selectedRoles">
                    <div th:each="chip : ${selectedRoles}" class="selected-item">
                        <span th:text="${chip.display}"></span>
                        <button type="button"
                                th:hx-get="@{/api/roles/remove(id=${chip.id})}"
                                hx-include="#roleIds" hx-target="#roleBox" hx-swap="outerHTML">×
                        </button>
                    </div>
                </div>
                <input type="hidden" id="roleIds" name="roleIds"
                        th:value="${#strings.listJoin(selectedRoles.![id], ',')}">
            </div>

            <!-- Roles already stored for the selected practitioner, shown below the role picker -->
            <th:block th:replace="~{fragments/existing-roles :: panel}"></th:block>
        </form>
    </div>
    <div class="button-group">
        <button class="cancel-btn" hx-get="/api/roles/reset" hx-swap="none">
            Abbrechen
        </button>
        <button class="post-btn" form="roleForm" type="submit">
            + Hinzufügen
        </button>
    </div>
</div>
</body>
</html>
