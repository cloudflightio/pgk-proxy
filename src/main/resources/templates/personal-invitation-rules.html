<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Einladungen</title>
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet">
</head>
<header th:replace="~{fragments/header :: header}"></header>

<!--
    hx-headers on <body> adds the CSRF token to EVERY HTMX request originating from this
    page, so the search, the select and the add/remove calls work without per-element headers.
-->
<body th:attr="hx-headers=|{&quot;${_csrf.headerName}&quot;:&quot;${_csrf.token}&quot;}|">
<div id="notification" class="notification"></div>
<input type="checkbox" id="sidebarToggle" class="sidebar-toggle-checkbox">
<th:block th:replace="~{fragments/sidebar :: sidebar(active='invitations', subtitle='Verwaltung')}"></th:block>

<div class="wrapper">
    <div class="title">
        <h1>Einladungen</h1>
        <p>Legen Sie fest, von welchen Rollen und Benutzern Ihnen keine Einladungen aus dem
            föderierten Netzwerk gesendet werden dürfen. Blockierte Rollen und Benutzer gelten
            auf allen föderierten Servern. Ohne Regeln sind Einladungen von allen erlaubt.</p>
    </div>

    <div class="boxed">
        <div class="card-row">
            <h2 class="boxed-title">Blockierte Rollen</h2>
            <!--
                The "Regel hinzufügen" label loads a fresh self-contained dialog fragment via
                hx-get into #personalRulesDialog. The fragment owns its own checkbox + overlay
                and closes via its own ✕ / "Abbrechen" / backdrop labels, so the page holds no
                toggle state. The rows live in fragments/personal-rules.html so the page and
                the HTMX responses never drift.
            -->
            <label class="blocked-edit"
                    hx-get="/me/invitation-rules/dialog"
                    hx-target="#personalRulesDialog"
                    hx-swap="outerHTML">+ Regel hinzufügen</label>
        </div>
        <th:block th:replace="~{fragments/personal-rules :: panel}"></th:block>
    </div>

    <div class="boxed">
        <!--
            Personal user block list: mxids the logged-in user added manually (or picked from
            the name suggestions). The panel lives in fragments/personal-blocked-users.html so
            the list, the add-form with suggestions and the HTMX responses never drift.
        -->
        <div class="card-row">
            <h2 class="boxed-title">Blockierte Benutzer</h2>
        </div>
        <th:block th:replace="~{fragments/personal-blocked-users :: panel}"></th:block>
    </div>
</div>

<!--
    The dialog is loaded into #personalRulesDialog by the "Regel hinzufügen" label's hx-get.
    The dialog fragment is self-contained: it renders its own hidden checkbox + overlay and
    shows itself (the checkbox starts checked); the ✕ / "Abbrechen" / backdrop labels inside
    the fragment uncheck that own checkbox to close. No page-level toggle and no script.
-->
<div id="personalRulesDialog"></div>
</body>
</html>
