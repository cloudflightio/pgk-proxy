# ---------- ACLs ----------
acl outbound_whitelist dstdomain "/etc/squid/dynamic/whitelist.txt"
acl federation_ports port 8448 443
acl CONNECT method CONNECT

# Reverse-proxy ACLs
acl reverse_port localport 3129
acl matrix-inbound dstdomain matrix.traefik.me
# Inbound federation origin check
external_acl_type matrix_origin ttl=0 negative_ttl=0 children-max=5 children-startup=1 %>ha{Authorization} /usr/local/bin/matrix_origin_helper.py
acl fed_origin_ok external matrix_origin
# Unauthenticated endpoints remote servers must be able to reach
acl fed_public_paths urlpath_regex -i ^/_matrix/key/v2/server(/|$) ^/_matrix/federation/v1/version$

# ---------- Ports ----------
# Forward proxy (outbound CONNECT), unchanged
http_port 3128
# Reverse proxy / accelerator for Traefik -> Matrix
http_port 3129 accel vhost defaultsite=matrix.traefik.me

# ---------- Origin server ----------
cache_peer matrix parent 8448 0 no-query originserver name=matrix login=PASSTHRU

cache_peer_access matrix allow reverse_port matrix-inbound
cache_peer_access matrix deny all
never_direct allow matrix-inbound

# ---------- Access rules ----------
http_access allow reverse_port matrix-inbound fed_public_paths
http_access allow reverse_port matrix-inbound fed_origin_ok

http_access allow CONNECT outbound_whitelist federation_ports
http_access deny all

cache deny all

acl denied http_status 403
logformat pgk timestamp=%tl actor=%>a action=%rm "%rm %ru HTTP/%rv" %>Hs %<st
access_log stdio:/dev/stdout pgk denied
cache_log /dev/null
